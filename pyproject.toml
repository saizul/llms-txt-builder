[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llms-txt-builder"
dynamic = ["version"]
description = "Generate and validate llms.txt and llms-full.txt for any website from a sitemap, a polite crawl or a URL list: main-content extraction to Markdown, section rules, a spec linter with CI exit codes, and a diff against the live file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["llms-txt", "llms.txt", "seo", "technical-seo", "sitemap", "crawler", "markdown", "linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7.4", "ruff>=0.4", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/saizul/llms-txt-builder"
Issues = "https://github.com/saizul/llms-txt-builder/issues"
Changelog = "https://github.com/saizul/llms-txt-builder/blob/main/CHANGELOG.md"

[project.scripts]
llms-txt-builder = "llms_txt_builder.cli:main"

[tool.setuptools.dynamic]
version = { attr = "llms_txt_builder._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llms_txt_builder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
